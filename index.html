<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VERDANT — A sea of green</title>
    <meta
      name="description"
      content="A living rice field in the browser: procedural plants, wind on the GPU, one draw call per band of the stand, and a camera you walk with the arrow keys, WASD and the pointer - or with a thumb pad, a drag and a tap on a phone."
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:," />
    <!--
      three.js is the page's only library and it comes from a CDN, pinned to
      r170 - the exact build the onBeforeCompile patches in js/shaders.js are
      written against (verified: 1314659 bytes, sha256 ce1fa418de16a194...).
      Nothing is vendored in this project any more; to run with no network at
      all, install the same build with "npm install three@0.170.0" and point
      the map at "./node_modules/three/build/three.module.js". The examples/jsm
      prefix is mapped so an addon could be imported as
      "three/examples/jsm/controls/PointerLockControls.js".
      Import maps take plain url strings only - Chrome rejects the {url,integrity}
      object form, so the pin is enforced by the version in the url, not SRI.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <canvas id="scene-canvas"></canvas>

    <section id="panel" class="panel" aria-label="Field controls">
      <!--
        the view row is gone: the two framings still exist, they are just reached
        with the v key and with ?view= in the url rather than with a thumb on the
        glass, which is what leaves the bar the one control a viewer actually
        reaches for
      -->

      <!--
        the sickle toggle is one button rather than a pair: it flips a mode, so
        the button itself says which mode is live by carrying .on, which is the
        same state app.js reads for the pointer handlers
      -->
      <div class="row tool">
        <span class="label">Sickle</span>
        <button data-action="sickle">Sickle</button>
      </div>

      <!--
        the shop row is the bar's second control: a thumb on it opens or closes
        the card the field's kit sits on, and the b key takes the same flip on a
        keyboard, which is what keeps a phone and a desktop agreeing about one
        mode rather than two
      -->
      <div class="row shop">
        <span class="label">Shop</span>
        <button data-action="shop">Shop</button>
      </div>

      <div class="row rig">
        <span class="label">Elevate</span>
        <button class="hold" data-hold="1">Rise</button>
        <button class="hold" data-hold="-1">Lower</button>
      </div>
    </section>

    <!--
      The hand's health. The purse counts what the cuts pay in; this bar counts
      what they cost: a check that goes through the air takes 20 off the arm and
      each hour that passes takes 10, so the share of the bar still standing is
      the share of the working day left. The bar is DOM over the canvas rather
      than a number the player has to find in the readout, which is what keeps
      the cost of the next miss legible while the needle is still crossing the
      track. app.js writes the fill's width as a share of the bar, so the markup
      stays put and the bar never resizes itself. It hangs on the middle of the
      left edge: the readout owns the lower right, the pad owns the lower right
      at a phone width and the shop card owns the top of that same edge, so the
      middle of it is the one stretch none of them takes.
    -->
    <div id="health" class="health" aria-label="The hand's health">
      <div class="fill" id="health-fill"></div>
    </div>

    <!--
      The shop card. The purse is a ledger rather than a score, so it can also
      buy: the kit the field sells is priced in the very gold the cuts pay into
      and the sickle spends from, and a purchase spends the fee through payGold
      rather than subtracting it from a total - so a piece the purse cannot pay
      is refused rather than debt, the same rule a swipe answers to. The ration
      is the one row that is not kit: it is eaten rather than carried, so it
      fills the hand rather than moving a number the field runs on, and it is
      the only row the purse can buy more than once.

      The rows are declarative here and carry only the id of the piece they sell:
      the id on a buy button is the id app.js's EQUIPMENT table prices, equips
      and refuses, and the price the button names is written into it from that
      same table, so the number on the glass is the number buy() spends. The card
      stays hidden until the Shop row on the bar (or the b key) drops the hidden
      attribute, which is what keeps a field nobody has shopped in reading and
      paying exactly as it did before.
    -->
    <div id="shop" class="shopcard" aria-label="The field shop" hidden>
      <div class="row purse">
        <span class="label">Purse</span>
        <span class="coins" id="shop-purse"></span>
      </div>

      <div class="row kit">
        <span class="name">Whetstone</span>
        <button class="buy" data-buy="whetstone"></button>
        <span class="note">the check's great and good bands widen</span>
      </div>

      <div class="row kit">
        <span class="name">Blade Oil</span>
        <button class="buy" data-buy="bladeoil"></button>
        <span class="note">a swipe spends nothing off the purse</span>
      </div>

      <div class="row kit">
        <span class="name">Long Snath</span>
        <button class="buy" data-buy="snath"></button>
        <span class="note">the ring both tools answer to grows by 1.2 m</span>
      </div>

      <div class="row kit">
        <span class="name">Gilded Sickle</span>
        <button class="buy" data-buy="gild"></button>
        <span class="note">every cut pays one gold more</span>
      </div>

      <!--
        the ration is the card's one repeatable row: it is eaten rather than
        carried, so it moves the hand rather than a number the field runs on,
        and a hand at the top of its day refuses it - the row answers "not
        hungry" rather than selling a meal that would recover nothing
      -->
      <div class="row food">
        <span class="name">Rice Ration</span>
        <button class="buy" data-buy="ration"></button>
        <span class="note">the hand recovers 40 hp</span>
      </div>
    </div>

    <!--
      The hour has no buttons here any more: it walks itself through morning,
      afternoon and golden hour on the frame clock (one minute each by default, ?light=
      pins one). Wind, pause and the walk are keyboard-only - Shift+Arrow nudges
      the wind, Space toggles pause, k draws or sheathes the sickle, v swaps the
      framing, b opens or closes the shop card, and the arrow keys / WASD walk. The
      rig row stays because a phone has no E / Q.
    -->

    <!--
      Sound has no controls here either, and nothing is fetched until a cue is
      asked for: the small bird (samllbirdvoice.mp3) calls through the daylight
      hours - morning and afternoon - and the evening cicada (higurashi.mp3)
      takes over while the field is under the golden hour; whichever loop is
      running stops the moment its hour leaves, and the skill check answers itself
      with cutgreat.mp3 for a great cut, cutnormal.mp3 for an ordinary one and
      hurt.mp3 for a miss. ?sound=0 mutes the whole field. A loop the browser
      has refused to start - its autoplay policy wants the visitor to touch the
      page first - is asked for again on the next frame, so the bird joins in
      the moment the visitor moves.
    -->

    <div id="pad" class="pad" aria-label="Walk pad">
      <div id="pad-knob" class="knob"></div>
    </div>

    <div id="skill" class="skill" aria-label="Skill check" hidden>
      <div class="band" id="skill-normal"></div>
      <div class="band good" id="skill-good"></div>
      <div class="band great" id="skill-great"></div>
      <div class="needle" id="skill-needle"></div>
      <div class="verdict" id="skill-verdict"></div>
    </div>

    <!--
      The purse's fireworks. One layer for everything a cut answers with besides
      its own words: the shockwave left at the point the blade went through, the
      sparks that climb out of it and fall, and the readout a sickle swipe leaves
      where the blade ended. The layer is pointer-transparent so it can never eat
      the click that follows a cut, and its nodes are a fixed pool app.js reuses
      - a cut writes transforms rather than allocating. The skill check's words
      stay on the meter (#skill-verdict) so the harness that grades a pass still
      reads the claim out of the markup it was promised.
    -->
    <div id="flair" class="flair" aria-label="The purse's fireworks" hidden></div>

    <!--
      The line the sickle has drawn lives here rather than in the scene: the
      stroke belongs to the glass, so it is one polyline whose points are the very
      numbers the reaping ran on, it is pointer-transparent so it can never eat a
      click, and a harness can read it back out of the markup. app.js writes the
      points and hides the element between swipes.
    -->
    <svg id="stroke" class="stroke" aria-label="The line the sickle has drawn" style="display: none">
      <polyline id="stroke-band" points=""></polyline>
      <polyline id="stroke-line" points=""></polyline>
    </svg>

    <div id="stats" class="stats"></div>
    <div id="err" class="err"></div>
  </body>
</html>
